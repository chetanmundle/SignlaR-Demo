<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg rounded-4">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4 text-primary">Register</h3>

          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" class="form-control" formControlName="name" />
              <div *ngIf="registerForm.controls['name'].touched && registerForm.controls['name'].invalid" class="text-danger mt-1">
                Name is required.
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" id="email" class="form-control" formControlName="email" />
              <div *ngIf="registerForm.controls['email'].touched && registerForm.controls['email'].invalid" class="text-danger mt-1">
                <div *ngIf="registerForm.controls['email'].errors?.['required']">Email is required.</div>
                <div *ngIf="registerForm.controls['email'].errors?.['email']">Enter a valid email.</div>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" formControlName="password" />
              <div *ngIf="registerForm.controls['password'].touched && registerForm.controls['password'].invalid" class="text-danger mt-1">
                <div *ngIf="registerForm.controls['password'].errors?.['required']">Password is required.</div>
                <div *ngIf="registerForm.controls['password'].errors?.['minlength']">Minimum 5 characters required.</div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
