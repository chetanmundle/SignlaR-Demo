<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg rounded-4">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4 text-primary">Login</h3>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input
                type="email"
                id="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter your email"
              />
              <div *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].invalid" class="text-danger mt-1">
                <div *ngIf="loginForm.controls['email'].errors?.['required']">Email is required.</div>
                <div *ngIf="loginForm.controls['email'].errors?.['email']">Enter a valid email.</div>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                formControlName="password"
                placeholder="Enter your password"
              />
              <div *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].invalid" class="text-danger mt-1">
                <div *ngIf="loginForm.controls['password'].errors?.['required']">Password is required.</div>
                <div *ngIf="loginForm.controls['password'].errors?.['minlength']">Minimum 5 characters required.</div>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>

            <!-- Footer -->
            <div class="text-center mt-3">
              <small class="text-muted">Don't have an account? <a href="#" class="text-decoration-none">Register</a></small>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
