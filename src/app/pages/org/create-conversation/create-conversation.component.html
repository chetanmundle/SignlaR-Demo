<div class="create-conversation-parent">
    <div class="form-group position-relative">
        <div class="mb-3">
            <label for="conversationName">Conversation Name</label>
            <input type="text" id="conversationName" class="form-control" [(ngModel)]="conversationName">
        </div>
        <div class="d-flex flex-wrap gap-2 border rounded p-2" (click)="skillInput?.focus()">
            <!-- Selected Skills -->
            <span *ngFor="let user of selectedUsers; let i = index"
                class="badge bg-primary d-flex align-items-center">
                {{ user.name }}
                <button type="button" class="btn-close btn-close-white btn-sm ms-2" (click)="removeUser(i)"></button>
            </span>

            <!-- Input -->

            <input type="text" #skillInput [(ngModel)]="inputValue" (input)="filterUsers()"
                class="border-0 flex-grow-1" style="min-width: 120px; outline: none;"
                placeholder="Select from list..." />
            <button class="btn btn-outline-primary" type="button" id="button-addon2" (click)="CreateConversation()">Create</button>
        </div>

        <!-- Skill Suggestions -->
        <ul class="list-group position-absolute w-100 shadow-sm mt-1 z-3" *ngIf="filterdUsers.length > 0">
            <li class="list-group-item list-group-item-action" *ngFor="let user of filterdUsers"
                (click)="addUser(user)">
                <span>{{ user.name }}</span>
            </li>
        </ul>
    </div>
</div>
