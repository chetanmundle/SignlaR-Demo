<div class="d-flex flex-column h-100">
  @if (currentConversation) {
  <!-- Header -->
  <div class="d-flex align-items-center p-3 border-bottom">
    <img src="images/human.svg" class="rounded-circle me-3" alt="u" />
    <div>
      <h6 class="mb-0">{{currentConversation.conversationName}}</h6>
      <small class="text-muted">Online</small>
    </div>
  </div>

  <!-- Messages -->

  <div class="flex-grow-1 p-3 overflow-auto bg-light" style="min-height: 0;">
    <div *ngFor="let msg of messages" [ngClass]="{ 'text-end': msg.isMe }" class="mb-2">
      <span class="d-inline-block p-2 rounded" [ngClass]="msg.isMe ? 'bg-primary text-white' : 'bg-white border'">
        {{ msg.messageContent }}
      </span>
    </div>
  </div>

  <!-- Input -->
  <div class="p-3 border-top">
    <div class="input-group">
      <input type="text" class="form-control" plsaceholder="Type a message..." [(ngModel)]="message"
        (keyup.enter)="sendMessage()" />
      <button class="btn btn-primary" (click)="sendMessage()">Send</button>
    </div>
  </div>
  }@else {
  <div>Please Select the Conversation</div>
  }
</div>
